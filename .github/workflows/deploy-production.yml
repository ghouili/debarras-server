name: Deploy Express CRM API (Production)

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: deploy

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}

      # Variables (Environment -> deploy -> Variables)
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      NODE_VERSION: ${{ vars.NODE_VERSION || '20' }}
      PM2_APP: ${{ vars.PM2_APP || 'express-crm-api' }}
      APP_PORT: ${{ vars.APP_PORT || '3000' }}
      NVM_DIR: ${{ vars.NVM_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Use pinned known_hosts if provided, otherwise scan
          if [[ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ]]; then
            echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deploy script
        run: |
          scp -P "$SSH_PORT" deploy.sh "$SSH_USERNAME@$SSH_HOST:/tmp/deploy.sh"

      # ----------------------------
      # OPTIONAL: Upload env payload
      # Create a secret named EXPRESS_ENV in Environment "deploy" if needed
      # ----------------------------
      # - name: Upload env payload
      #   run: |
      #     echo "${{ secrets.EXPRESS_ENV }}" > env.payload
      #     scp -P "$SSH_PORT" env.payload "$SSH_USERNAME@$SSH_HOST:/tmp/express-api.env"
      #     rm env.payload

      - name: Execute remote deployment
        run: |
          ssh -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" "\
            export APP_DIR='${DEPLOY_PATH}' && \
            export REPO_URL='git@github.com:${{ github.repository }}.git' && \
            export BRANCH='production' && \
            export NVM_DIR='${{ vars.NVM_DIR }}' && \
            export PM2_APP='${PM2_APP}' && \
            export APP_PORT='${APP_PORT}' && \
            export ENV_PAYLOAD_PATH='/tmp/express-api.env' && \
            bash /tmp/deploy.sh \
          "