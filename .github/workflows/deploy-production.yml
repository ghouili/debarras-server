name: Deploy Débarras Server API (Production)

on:
  push:
    branches: [production]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: deploy

    # 최소 권한 (checkout에만 필요)
    permissions:
      contents: read

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}

      # ---- Remote deploy config (Environment -> deploy -> Variables) ----
      APP_DIR: ${{ vars.APP_DIR || '/var/www/debarras/api' }}
      BRANCH: ${{ vars.BRANCH || 'production' }}
      PM2_APP: ${{ vars.PM2_APP || 'debarras-server' }}
      NODE_VERSION: ${{ vars.NODE_VERSION || '24' }}

      # ---- App env vars (GitHub Environment -> Variables) ----
      PORT: ${{ vars.PORT || '4000' }}
      DATABASE_URL: ${{ vars.DATABASE_URL }}
      JWT_ACCESS_SECRET: ${{ vars.JWT_ACCESS_SECRET }}
      JWT_REFRESH_SECRET: ${{ vars.JWT_REFRESH_SECRET }}
      JWT_ACCESS_TTL: ${{ vars.JWT_ACCESS_TTL || '15m' }}
      JWT_REFRESH_TTL: ${{ vars.JWT_REFRESH_TTL || '30d' }}
      REQUIRE_EMAIL_VERIFICATION: ${{ vars.REQUIRE_EMAIL_VERIFICATION || 'false' }}
      CORS_ORIGIN: ${{ vars.CORS_ORIGIN || 'http://localhost:3000' }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      SMTP_USER: ${{ vars.SMTP_USER }}
      SMTP_PASS: ${{ vars.SMTP_PASS }}
      SMTP_FROM: ${{ vars.SMTP_FROM }}
      RATE_LIMIT_WINDOW_MS: ${{ vars.RATE_LIMIT_WINDOW_MS || '900000' }}
      RATE_LIMIT_MAX: ${{ vars.RATE_LIMIT_MAX || '100' }}
      RATE_LIMIT_AUTH_MAX: ${{ vars.RATE_LIMIT_AUTH_MAX || '10' }}

      # Repo to deploy (SSH URL is required on server side)
      # (You can override with an Environment Variable if you want.)
      REPO_SSH_URL: ${{ vars.REPO_SSH_URL || 'git@github.com:ghouili/debarras-server.git' }}

      # Path ON THE SERVER to the GitHub deploy key (private key file)
      # This key is NOT stored in GitHub Secrets.
      GITHUB_DEPLOY_KEY_PATH: ${{ vars.GITHUB_DEPLOY_KEY_PATH || '$HOME/.ssh/debarras_server_github_deploy' }}

    steps:
      - name: Checkout (for deploy.sh)
        uses: actions/checkout@v4

      # This key is the VPS login key (CI -> VPS), NOT the GitHub deploy key.
      - name: Setup SSH agent (CI -> VPS)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Write SSH key file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add VPS host to known_hosts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [[ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ]]; then
            echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          else
            # Best practice is to pin SSH_KNOWN_HOSTS, but scanning is better than disabling checks.
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          fi

          chmod 600 ~/.ssh/known_hosts

      # - name: Debug SSH auth (safe)
      #   shell: bash
      #   run: |
      #     set -euo pipefail
      #     ssh -vvv \
      #       -p "$SSH_PORT" \
      #       -i ~/.ssh/id_ed25519 \
      #       -o IdentitiesOnly=yes \
      #       -o StrictHostKeyChecking=yes \
      #       -o UserKnownHostsFile=~/.ssh/known_hosts \
      #       "$SSH_USERNAME@$SSH_HOST" "echo 'SSH OK'" || true

      - name: Create env payload from GitHub vars
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            "PORT=$PORT" \
            "DATABASE_URL=$DATABASE_URL" \
            "JWT_ACCESS_SECRET=$JWT_ACCESS_SECRET" \
            "JWT_REFRESH_SECRET=$JWT_REFRESH_SECRET" \
            "JWT_ACCESS_TTL=$JWT_ACCESS_TTL" \
            "JWT_REFRESH_TTL=$JWT_REFRESH_TTL" \
            "REQUIRE_EMAIL_VERIFICATION=$REQUIRE_EMAIL_VERIFICATION" \
            "CORS_ORIGIN=$CORS_ORIGIN" \
            "SMTP_HOST=$SMTP_HOST" \
            "SMTP_PORT=$SMTP_PORT" \
            "SMTP_USER=$SMTP_USER" \
            "SMTP_PASS=$SMTP_PASS" \
            "SMTP_FROM=$SMTP_FROM" \
            "RATE_LIMIT_WINDOW_MS=$RATE_LIMIT_WINDOW_MS" \
            "RATE_LIMIT_MAX=$RATE_LIMIT_MAX" \
            "RATE_LIMIT_AUTH_MAX=$RATE_LIMIT_AUTH_MAX" \
            > env.payload

      - name: Upload env payload to VPS
        shell: bash
        run: |
          scp -i ~/.ssh/id_ed25519 -P "$SSH_PORT" env.payload "$SSH_USERNAME@$SSH_HOST:/tmp/express-api.env"
          rm -f env.payload

      - name: Upload deploy script to VPS
        shell: bash
        run: |
          scp -i ~/.ssh/id_ed25519 -P "$SSH_PORT" deploy.sh "$SSH_USERNAME@$SSH_HOST:/tmp/deploy.sh"

      - name: Execute remote deployment
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -p "$SSH_PORT" \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$SSH_USERNAME@$SSH_HOST" "bash -lc '
              chmod +x /tmp/deploy.sh

              export APP_DIR=\"${APP_DIR}\"
              export BRANCH=\"${BRANCH}\"
              export REPO_URL=\"${REPO_SSH_URL}\"

              export NODE_VERSION=\"${NODE_VERSION}\"
              export PM2_APP=\"${PM2_APP}\"

              export GITHUB_DEPLOY_KEY_PATH=\"${GITHUB_DEPLOY_KEY_PATH}\"
              export ENV_PAYLOAD_PATH="/tmp/express-api.env"

              /tmp/deploy.sh
            '"
